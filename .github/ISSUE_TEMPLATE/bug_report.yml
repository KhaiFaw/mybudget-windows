name: Bug report
description: Report a reproducible MyBudget problem using synthetic or non-sensitive data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MyBudget. Never attach a real database, backup, CSV export, financial screenshot, credential, or other sensitive information.

  - type: input
    id: version
    attributes:
      label: MyBudget version
      description: Enter the release version or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic data and provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all personal and financial information from this report and its attachments.
          required: true
